[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shibata"
version = "0.1.0"
description = "Reproducible JRA win probability research"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "pyarrow==20.0.0", "scikit-learn==1.7.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
phase0 = ["matplotlib==3.10.6", "lightgbm==4.6.0", "catboost==1.2.8",
          "jupyterlab==4.4.9", "nbclient==0.10.2", "nbformat==5.10.4", "ipykernel==6.30.1"]

[project.scripts]
shibata-check = "shibata.phase0:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
